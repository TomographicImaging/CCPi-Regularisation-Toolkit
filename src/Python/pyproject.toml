[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["ccpi", "ccpi.*"]
[tool.setuptools.package-data]
"ccpi.filters" = ["*cilreg.*"] # cmake libraries

[project]
version = "25.0.0"
name = "ccpi-regulariser"
dependencies = ["numpy"]
